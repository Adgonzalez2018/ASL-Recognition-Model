# ASL Citizen: primary dataset.
#
# The dataset root is supplied at runtime through ASL_DATASET_ROOT or a
# command-line override. It is deliberately absent here: reusable configuration
# must not carry environment-specific paths. See docs/ENVIRONMENTS.md.
#
# Class count is not pinned. It comes from the label map generated by the audit,
# so the model and the vocabulary cannot disagree.

dataset:
  name: asl_citizen

  # Written by scripts/audit_dataset.py --write-manifests, relative to the
  # artifacts directory.
  label_map: label_maps/asl_citizen.json
  manifests:
    train: manifests/asl_citizen_train.csv
    validation: manifests/asl_citizen_validation.csv
    test: manifests/asl_citizen_test.csv

  # ASL Citizen's official splits are signer-independent. Overlap indicates a
  # construction bug, so validation blocks on it. Enabling this override
  # requires a documented reason in the experiment record.
  allow_signer_overlap: false

preprocessing:
  # Frame count is part of the preprocessing identity and must match the model
  # configuration. Both architectures use 16 for the baseline; see D-003.
  num_frames: 16

  temporal_sampling:
    # Training may vary which frame represents each segment. Validation and
    # test must be deterministic, which the dataset enforces rather than trusts.
    train: random_segment
    eval: uniform

    # Clips shorter than num_frames repeat indices through uniform sampling.
    # Chronology is preserved and no motion is invented. Time reversal is not
    # available: reversed motion changes what a sign means.
    short_video_policy: repeat-via-uniform-sampling-v1

  spatial:
    crop_size: 224
    resize_size: 256
    interpolation: bilinear

    # ImageNet statistics, matching both VideoMAE and torchvision Swin3D, so
    # preprocessing does not confound the Phase 5 architecture comparison.
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  augmentation:
    # Restrained baseline: a mild random resized crop and nothing else.
    # Crop parameters are drawn once per clip, never per frame.
    train_scale: [0.8, 1.0]

    # Explicitly disabled. Recorded rather than omitted, so the resolved
    # configuration states what was off. These belong to Phase 7 robustness
    # experiments justified by measured weaknesses, not to the control.
    disabled:
      - horizontal_flip   # not established as label-preserving; needs review
      - speed_jitter
      - frame_dropping
      - blur
      - compression
      - brightness
      - contrast
      - saturation
      - rotation
      - random_erasing

loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

  # Training only. Evaluation never drops, because that would silently change
  # the evaluated sample count.
  drop_last_train: false

runtime:
  # "fail" surfaces any sample the audit did not predict. A run that needs
  # "skip" must reference a documented exclusion list, and the skipped count is
  # reported. Silent skipping is prohibited.
  failure_policy: fail
