[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-training"
version = "0.1.0"
description = "Isolated American Sign Language video classification: training, evaluation, calibration, and robustness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Torch and torchvision are intentionally unpinned to a build variant here.
# Colab and Kaggle preinstall builds matched to their CUDA drivers, and forcing a
# reinstall there is both slow and a common source of driver mismatch.
# See docs/ENVIRONMENTS.md.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "av>=12.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests needing network or the raw dataset are excluded by default so the
# ordinary suite runs offline. An explicit -m on the command line overrides this.
addopts = '-q --strict-markers -m "not pretrained and not dataset"'
markers = [
    # Downloads pretrained weights. Excluded from the default run; see D-005 in
    # docs/DECISIONS.md. Run with: pytest -m pretrained
    "pretrained: requires network access to download pretrained weights",
    # Requires the real ASL Citizen dataset to be present and configured.
    "dataset: requires the raw dataset at ASL_DATASET_ROOT",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # function call in argument default; common and readable in config dataclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
